<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100" style="background-color: rgb(223,189,255);">

    <form class="bg-white w-25  mx-auto  p-3 rounded shadow-sm mb-3 mt-3 small">
        
        <h6 class="text-center fw-bold mb-3" style="color: purple;">Sign Up</h6>

        <!-- Name -->
        <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" class="form-control form-control-sm" required>
        </div>

        <!-- Email -->
        <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" class="form-control form-control-sm" required>
        </div>

        <!-- Password -->
        <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-sm" required>
        </div>

        <!-- Price -->
        <div class="mb-3">
            <label class="form-label">Price</label>
            <select class="form-control form-control-sm" required>
                <option selected>Admin</option>
                <option>Rs 6000</option>
                <option>Rs 7000</option>
                <option>Rs 8000</option>
            </select>
        </div>

        <!-- Button -->
        <div >
            <button class="btn btn-sm text-white px-3"
                    style="background-color: purple;">
                Sign Up
            </button>
        </div>

        <!-- Login -->
        <p class="fw-bold text-center mt-3 mb-0">
            Already have an account?
            <a href="loginkba.html" style="color: purple;">Login</a>
        </p>

    </form>

</body>
</html>
