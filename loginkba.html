<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100" style="background-color: rgb(223,189,255);">

    <form class="bg-white p-4 rounded shadow-sm small" style="width: 100%; max-width: 350px;">
        
        <h6 class="text-center fw-bold mb-3" style="color: purple;">Login</h6>

        <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" class="form-control form-control-sm" required>
        </div>

        <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-sm" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-sm text-white px-3" style="background-color: purple;">
                Login
            </button>
            <a href="#" style="color: purple; font-size: smaller; text-decoration: none;">Forgot Password?</a>
        </div>

        <p class="fw-bold text-center mt-3 mb-0">
            Don't have an account?
            <a href="signupkba.html" style="color: purple;">Sign Up</a>
        </p>

    </form>

</body>
</html>
