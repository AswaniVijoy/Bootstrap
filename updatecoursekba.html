<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: rgb(244, 242, 246);">


 <nav>
        <div style="background-color: rgb(223,189,255);" class="d-flex">
            <div><img src="./images/KBA_logo.png" alt="" style="width: 15px;"></div>
            <div class="d-flex justify-content-end w-100 small gap-2 " style="font-size: x-small;">
                <a class="nav-link " href="homekba.html" style="color: black ">Home</a>
                <a class="nav-link " href="courseskba.html" style="color: black ">Courses</a>
                <a class="nav-link " href="contactkba.html" style="color: black ">Contact Us</a>
                <a class="nav-link " href="addcoursekba.html" style="color: black ">Add Course</a>
                <a class="nav-link " href="loginkba.html" style="color: black ">Logout</a>
                
            </div>
        </div>
    </nav>


<div class="container mt-5 small mb-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class=" p-4 rounded shadow" style="background-color: rgb(223,189,255);"">

                <h4 class="text-center fw-bold mb-4" style="color: purple;">
                    Update Course
                </h4>

                <form>
                    
                    <div class="mb-3">
                        <label class="form-label">Course Name</label>
                        <input type="text" class="form-control" placeholder="s122">
                    </div>

                    
                    <div class="mb-3">
                        <label class="form-label">Course Type</label>
                        <select class="form-select" required>
                            <option selected>Hybrid</option>
                            <option>Course2</option>
                            <option>Course3</option>
                        </select>
                    </div>

                   
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="4" placeholder="11q" required></textarea>
                    </div>

                   
                    <div class="mb-4">
                        <label class="form-label">Price</label>
                        <select class="form-select" required>
                            <option>5000</option>
                            <option>6000</option>
                            <option>7000</option>
                        </select>
                    </div>

                    
                    <div class="text-center">
                        <button type="submit" class="btn rounded-pill px-5 w-100 text-white" style="background-color: purple;" >
                            Update Course
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
